[project]
name = "orderdesk"
version = "0.1.0"
description = "AI order desk: turns purchase-order emails and PDFs into approved draft orders"
readme = "README.md"
authors = [
    { name = "Zak Ismail", email = "zak_0089@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic-settings>=2.16.3",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.scripts]
orderdesk = "orderdesk:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres from docker-compose.yml (skipped if unreachable)"]

[tool.ruff]
line-length = 100
