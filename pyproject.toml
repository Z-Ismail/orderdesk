[project]
name = "orderdesk"
version = "0.1.0"
description = "lol"
readme = "README.md"
authors = [
    { name = "Zak Ismail", email = "zak_0089@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.9",
    "pypdf>=5.0",
]

[project.scripts]
orderdesk = "orderdesk:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
