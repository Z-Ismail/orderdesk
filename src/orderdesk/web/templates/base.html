<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}orderdesk{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --ink: #1d2127; --muted: #69707a; --line: #e3e5e8; --bg: #f6f7f8; --card: #fff;
      --accent: #2456d6; --ok: #1f7a4d; --ok-bg: #e6f4ec; --warn: #8a5a00; --warn-bg: #fdf3dc;
      --bad: #b42318; --bad-bg: #fde9e7; --done: #2456d6; --done-bg: #e8eefc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           color: var(--ink); background: var(--bg); }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .brand { font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
    .brand span { color: var(--accent); }
    .who { color: var(--muted); font-size: 13px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
    main { padding: 28px 0 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
    h2 { font-size: 15px; margin: 32px 0 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
         letter-spacing: 0.04em; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tr.link { cursor: pointer; } tr.link:hover td { background: #fafbfc; }
    a { color: var(--accent); }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
    .badge.ok { color: var(--ok); background: var(--ok-bg); } .badge.warn { color: var(--warn); background: var(--warn-bg); }
    .badge.bad { color: var(--bad); background: var(--bad-bg); } .badge.done { color: var(--done); background: var(--done-bg); }
    .badge.muted { color: var(--muted); background: #eef0f2; }
    .muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; }
    .flash { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-weight: 500; }
    .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 500; }
    .issues { margin: 0; padding: 0; list-style: none; }
    .issues li { padding: 6px 0; } .issues code { font-size: 12px; color: var(--bad); background: var(--bad-bg); padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
    .agent { border-left: 3px solid var(--accent); padding: 12px 16px; background: #f7f9fe; border-radius: 0 8px 8px 0; margin: 16px 0; }
    .agent b { color: var(--accent); }
    input[type=text], input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid #cfd3d8; border-radius: 6px; width: 100%; background: #fff; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .qty { width: 80px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 18px; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; } .primary:hover { background: #1c46b3; }
    .danger { background: #fff; color: var(--bad); border: 1px solid #f0c4bf; } .danger:hover { background: var(--bad-bg); }
    .actions { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .reject { display: flex; gap: 8px; align-items: center; } .reject input { width: 320px; }
    .check { font-size: 12px; margin-top: 4px; min-height: 18px; }
    .check .ok { color: var(--ok); } .check .bad { color: var(--bad); font-weight: 600; }
    details { margin-top: 24px; } summary { cursor: pointer; color: var(--accent); font-weight: 500; }
    pre { white-space: pre-wrap; font-size: 13px; background: #fafbfc; border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-height: 420px; overflow: auto; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { padding: 14px 16px; } .stat .n { font-size: 26px; font-weight: 700; } .stat .l { color: var(--muted); font-size: 13px; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .src { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="/">order<span>desk</span></a>
    <span class="who">Reviewing as {{ reviewer }}</span>
  </div></header>
  <main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
