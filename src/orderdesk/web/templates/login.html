{% extends "base.html" %}
{% block title %}Log in · orderdesk{% endblock %}
{% block content %}
<div class="card" style="max-width:400px; margin:48px auto; padding:28px">
  <h1>Log in</h1>
  <p class="sub">Reviewers only. Decisions are recorded under your email.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="small muted" for="email">Email</label>
    <input id="email" type="text" name="email" value="{{ email or '' }}" autocomplete="username" autofocus required style="margin:4px 0 14px">
    <label class="small muted" for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required style="margin:4px 0 20px; font:inherit; padding:6px 8px; border:1px solid #cfd3d8; border-radius:6px; width:100%">
    <button class="primary" type="submit" style="width:100%">Log in</button>
  </form>
</div>
{% endblock %}
