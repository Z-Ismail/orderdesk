# Local development database: Postgres 17 with the pgvector extension.
# Start: docker compose up -d     Stop: docker compose down     Wipe data: docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: orderdesk   # local-only throwaway credential
      POSTGRES_DB: orderdesk
    ports:
      - "5433:5432"   # 5433 on your Mac, so it can't clash with any Postgres you already run
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderdesk"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
